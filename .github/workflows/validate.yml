name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data libraries
        run: pip install "pandas==2.3.3" "pyarrow==21.0.0"
      - name: Validate repository
        run: python3 tests/validate_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - name: Test Rayfin sample (MCP client)
        working-directory: samples/rayfin
        run: npm test
